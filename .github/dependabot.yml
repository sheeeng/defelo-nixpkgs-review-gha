version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/api"
    schedule:
      interval: "daily"
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
